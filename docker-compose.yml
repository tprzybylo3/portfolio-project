services:

  # --- SOURCE database: simulates the e-commerce transactional system ---
  # This is the Postgres instance the portfolio pipeline will EXTRACT from
  # (windowed extract on `updated_at`, see ADR-006).
  postgres-source:
    image: postgres:16
    container_name: postgres-source
    environment:
      POSTGRES_USER: source_user
      POSTGRES_PASSWORD: source_password
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"        # host:container -- access from your laptop (e.g. DBeaver) on localhost:5432
    volumes:
      - pg_source_data:/var/lib/postgresql/data      # data survives container restarts
      - ./sql/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql   # Postgres runs this automatically on FIRST startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_user -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Airflow METADATA database: has nothing to do with business data ---
  # Airflow needs its own database to store DAG/task history, connections,
  # etc. Deliberately a separate container/database from postgres-source,
  # so the "orchestration engine" doesn't mix with the data it processes.
  postgres-airflow:
    image: postgres:16
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- One-off Airflow init: creates metadata tables + admin user ---
  # Runs ONCE per `up`, exits (exit 0), doesn't stay up as a persistent
  # service. Without this, the webserver/scheduler would start against an
  # empty, uninitialized database.
  #
  # NOTE on idempotency: `airflow users create` fails on the SECOND run
  # (user already exists) -- `|| true` swallows that specific, expected
  # failure so re-running `docker compose up -d` doesn't error out.
  # `airflow db migrate` is naturally idempotent, no guard needed there.
  airflow-init:
    build: ./airflow-docker
    container_name: airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # --- Phase 6: what the DAG's tasks need (values come from .env) ---
      # Inside the Docker network the source DB is the service name, not
      # localhost -- scripts read this, defaulting to localhost for laptop runs.
      POSTGRES_SOURCE_HOST: postgres-source
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}          # read by Java SDKs (cheat sheet 23.4)
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}  # read by boto3
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Absolute path of this repo ON THE HOST. DockerOperator asks the host's
      # Docker daemon to start the Spark container, and bind-mount sources are
      # resolved by that daemon -- so they must be host paths, not
      # /opt/airflow/... paths that only exist inside this container.
      HOST_PROJECT_DIR: ${PWD}
      # --- dbt -> Snowflake (task dbt_build), values from .env ---
      # Which mocked environment this Airflow is: picks the dbt target
      # (dev -> dbt_dev_* schemas, prod -> dbt_prod_*). CLAUDE.md decision 10.
      PIPELINE_ENV: ${PIPELINE_ENV:-dev}
      DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
      DBT_SNOWFLAKE_ACCOUNT: ${DBT_SNOWFLAKE_ACCOUNT}
      DBT_SNOWFLAKE_USER: ${DBT_SNOWFLAKE_USER}
      DBT_SNOWFLAKE_WAREHOUSE: ${DBT_SNOWFLAKE_WAREHOUSE}
      DBT_SNOWFLAKE_ROLE: ${DBT_SNOWFLAKE_ROLE:-portfolio_engineer}
      # Path INSIDE the container; the file itself is bind-mounted read-only
      # from the host path in .env (see airflow-scheduler volumes).
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /opt/airflow/secrets/rsa_key.p8
    command: >
      bash -c "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true)"

  airflow-webserver:
    build: ./airflow-docker
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "8080:8080"       # Airflow UI: http://localhost:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/scripts              # extract/validate scripts run by BashOperator
      - ./dbt_portfolio:/opt/airflow/dbt_portfolio  # dbt project run from the dbt venv
    command: webserver

  airflow-scheduler:
    build: ./airflow-docker
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./scripts:/opt/airflow/scripts
      - ./dbt_portfolio:/opt/airflow/dbt_portfolio
      # LocalExecutor runs tasks as subprocesses of the scheduler, so this is
      # the container that talks to Docker: DockerOperator starts the Spark
      # merge jobs as short-lived containers through the host's daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # dbt: the env-var-only profile template from the repo becomes the real
      # profiles.yml (no secrets in it), and the Snowflake private key is
      # mounted read-only from outside the repo -- never baked into the image.
      - ./dbt_portfolio/profiles.yml.example:/opt/airflow/dbt_profiles/profiles.yml:ro
      - ${DBT_SNOWFLAKE_PRIVATE_KEY_HOST_PATH:?set DBT_SNOWFLAKE_PRIVATE_KEY_HOST_PATH in .env}:/opt/airflow/secrets/rsa_key.p8:ro
    command: scheduler

  # --- Spark + Iceberg: used for the batch MERGE job into the Iceberg
  # table (Phase 3). This container just stays alive (tail -f /dev/null)
  # so we can `docker exec` into it to run spark-submit/pyspark scripts
  # interactively during development -- it's a workbench, not a
  # long-running service like the webserver/scheduler above.
  spark-iceberg:
    build: ./spark-docker
    # Fixed image name so DockerOperator can start fresh containers from it
    # (without this, Compose names the image after the folder/service).
    image: portfolio-spark:latest
    container_name: spark-iceberg
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
    volumes:
      - ./scripts:/opt/spark-scripts
    command: tail -f /dev/null

volumes:
  pg_source_data:
  pg_airflow_data:
