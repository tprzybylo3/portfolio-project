version: 2

models:
  - name: fct_orders
    description: >
      One row per order with its value, completed payments and the customer's
      country at order time (point-in-time SCD2 match) and today. Gold,
      Snowflake-managed Iceberg table. Row access policy
      portfolio_governance.policies.country_rls on country_at_order and
      masking policy portfolio_governance.policies.country_mask on
      current_country (post_hooks); SELECT granted to portfolio_analyst
      (grants config).
      Further guarded by singular tests
      assert_fct_orders_one_customer_version_per_order and
      assert_fct_orders_gross_value_reconciles.
    data_tests:
      # Business rules: amounts can never be negative.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "gross_order_value >= 0 AND paid_amount >= 0 AND refunded_amount >= 0"
          config:
            store_failures: true
      # Plausibility, not an invariant: a customer refunded and then paying
      # again legitimately ends above the order value. Passes on seed data;
      # WARN shows such a case without blocking the pipeline, store_failures
      # keeps the rows for inspection.
      - dbt_utils.expression_is_true:
          name: fct_orders_settled_not_above_order_value
          arguments:
            expression: "paid_amount + refunded_amount <= gross_order_value"
          config:
            severity: warn
            store_failures: true
    columns:
      - name: order_id
        description: Grain of the mart.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: UTC order timestamp.
        data_tests:
          - not_null
          # Silent stall (step 6.5 lesson): a run that never starts fails no
          # task, so no alert fires. If the newest order is older than 2 days,
          # the mart stopped receiving data even though everything is "green".
          # warn = visible signal without blocking; in a company this would be
          # routed to the on-call alert.
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: day
                interval: 2
              config:
                severity: warn
      - name: order_status
        description: Current status of the order.
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'shipped', 'delivered', 'cancelled']
      - name: country_at_order
        description: >
          Customer's country in the SCD2 version effective at order_date.
          Row access policy country_rls applies.
        data_tests:
          - not_null
          # Contract with the source: ISO 3166-1 alpha-2. The row access
          # policy filters on this value, so a wrong format (e.g. 'de',
          # 'DEU', ' DE') silently changes what an analyst can see -> error.
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[A-Z]{2}$"
      - name: current_country
        description: >
          Customer's country in the current SCD2 version. Masking policy
          country_mask applies: portfolio_analyst sees the value only when it
          is 'DE', otherwise NULL (RLS filters on country_at_order, so this
          column could otherwise leak a moved customer's country).
        data_tests:
          - not_null
      - name: is_before_first_customer_version
        description: >
          TRUE when order_date precedes the customer's first SCD2 version and
          the match relies on the 1900-01-01 backdating rule
          (int_customer_versions). Expected 115 of 200 on seed data.
        data_tests:
          - not_null
      - name: gross_order_value
        description: SUM(quantity * unit_price) over the order's lines; 0 if none.
        data_tests:
          - not_null
          # Plausibility range (the >= 0 rule is enforced above as an error).
          # Upper bound from the data's shape: prices 5-500, max 4 lines x 3
          # units -> ~6000; 10000 leaves room for price drift. Above it means
          # e.g. duplicated lines or a broken price -- warn + stored rows.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10000
              config:
                severity: warn
                store_failures: true
      - name: paid_amount
        description: >
          Net settled amount: SUM(amount) of payments with status 'completed';
          0 if none. Refunded payments are excluded (see refunded_amount),
          failed payments are in neither column.
        data_tests:
          - not_null
      - name: refunded_amount
        description: SUM(amount) of payments with status 'refunded'; 0 if none.
        data_tests:
          - not_null

unit_tests:
  # Logic of fct_orders on fixed rows (runs in dev/CI, excluded in prod):
  # payment statuses -> paid/refunded, order without lines -> 0, point-in-time
  # country (customer 5 moved LY -> FR on 2026-09-26), order before the first
  # customer version (customer 7) -> is_before_first_customer_version.
  - name: fct_orders_amounts_and_point_in_time_country
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1001, customer_id: 5, order_date: '2026-08-15 12:00:00', order_status: 'delivered'}
          - {order_id: 1002, customer_id: 5, order_date: '2026-09-30 09:00:00', order_status: 'paid'}
          - {order_id: 1003, customer_id: 7, order_date: '2026-07-15 08:00:00', order_status: 'pending'}
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1001, quantity: 2, unit_price: 10.00}
          - {order_id: 1001, quantity: 1, unit_price: 5.50}
          - {order_id: 1002, quantity: 3, unit_price: 20.00}
      - input: ref('stg_payments')
        rows:
          - {order_id: 1001, payment_status: 'completed', amount: 20.00}
          - {order_id: 1001, payment_status: 'failed',    amount: 25.50}
          - {order_id: 1001, payment_status: 'refunded',  amount: 5.50}
          - {order_id: 1002, payment_status: 'completed', amount: 60.00}
      - input: ref('int_customer_versions')
        rows:
          - {customer_id: 5, country: 'LY', valid_from: '2026-07-01 10:00:00', effective_from: '1900-01-01 00:00:00', effective_to: '2026-09-26 13:00:00', is_current: false}
          - {customer_id: 5, country: 'FR', valid_from: '2026-09-26 13:00:00', effective_from: '2026-09-26 13:00:00', effective_to: '9999-12-31 00:00:00', is_current: true}
          - {customer_id: 7, country: 'DE', valid_from: '2026-08-01 00:00:00', effective_from: '1900-01-01 00:00:00', effective_to: '9999-12-31 00:00:00', is_current: true}
    expect:
      rows:
        - {order_id: 1001, country_at_order: 'LY', current_country: 'FR', is_before_first_customer_version: false, gross_order_value: 25.50, paid_amount: 20.00, refunded_amount: 5.50}
        - {order_id: 1002, country_at_order: 'FR', current_country: 'FR', is_before_first_customer_version: false, gross_order_value: 60.00, paid_amount: 60.00, refunded_amount: 0}
        - {order_id: 1003, country_at_order: 'DE', current_country: 'DE', is_before_first_customer_version: true,  gross_order_value: 0,     paid_amount: 0,     refunded_amount: 0}
