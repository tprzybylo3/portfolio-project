version: 2

sources:
  - name: portfolio_ecommerce
    description: >
      Silver layer: Iceberg tables written by Spark (scripts/merge_dimensions.py,
      scripts/merge_facts.py), registered in AWS Glue Data Catalog and exposed
      in Snowflake through a READ-ONLY catalog-linked database.
    database: portfolio_ecommerce_db
    schema: portfolio_ecommerce
    # Glue/Iceberg identifiers are lowercase and the catalog-linked DB
    # resolves them case-sensitively (verified: dbt test PASS=17), so schema,
    # table and column names must be double-quoted.
    quoting:
      database: false
      schema: true
      identifier: true
    tables:
      - name: customer
        description: >
          Customers, full SCD Type 2 history maintained by Spark
          (valid_from/valid_to/is_current, event-time based). Masking policy
          on email and row access policy on country apply
          (portfolio_governance.policies).
      - name: product
        description: Products, full SCD Type 2 history maintained by Spark (valid_from/valid_to/is_current).
      - name: orders
        description: Orders, upserted by Spark -- current state per order_id.
      - name: order_items
        description: Order lines, upserted by Spark -- current state per order_item_id.
      - name: payments
        description: Payments, upserted by Spark -- current state per payment_id.
      - name: order_status_history
        description: Append-only log of order status changes.

models:
  - name: stg_customers
    description: >
      All SCD2 versions of each customer, one row per (customer_id,
      valid_from). Current state: is_current = TRUE; historical match:
      point-in-time join on [valid_from, valid_to).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['customer_id', 'valid_from']
    columns:
      - name: customer_id
        description: Business key of the customer (repeats once per version).
        data_tests:
          - not_null
          # SCD2 invariant: at most one current version per customer
          - unique:
              config:
                where: "is_current"
      - name: email
        description: Masked for roles without access (policy on the source table).
      - name: country
        description: Degenerate geography attribute (no separate dim_geography); row access policy applies.
      - name: valid_from
        description: UTC timestamp when this version became effective (inclusive).
        data_tests:
          - not_null
      - name: valid_to
        description: UTC timestamp when this version was superseded (exclusive); NULL for the current version.
      - name: is_current
        description: TRUE for the current version of the customer.
        data_tests:
          - not_null

  - name: stg_products
    description: >
      All SCD2 versions of each product (e.g. past prices), one row per
      (product_id, valid_from). Current state: is_current = TRUE; historical
      match: point-in-time join on [valid_from, valid_to).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['product_id', 'valid_from']
    columns:
      - name: product_id
        description: Business key of the product (repeats once per version).
        data_tests:
          - not_null
          # SCD2 invariant: at most one current version per product
          - unique:
              config:
                where: "is_current"
      - name: product_name
        description: Renamed from source column name.
      - name: stock_quantity
        description: Renamed from source column stock_qty.
      - name: valid_from
        description: UTC timestamp when this version became effective (inclusive).
        data_tests:
          - not_null
      - name: valid_to
        description: UTC timestamp when this version was superseded (exclusive); NULL for the current version.
      - name: is_current
        description: TRUE for the current version of the product.
        data_tests:
          - not_null

  - name: stg_orders
    description: One row per order with its current status.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: order_status
        description: Renamed from source column status.

  - name: stg_order_items
    description: One row per order line.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: quantity
        description: Renamed from source column qty.

  - name: stg_payments
    description: One row per payment with its current status.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: payment_method
        description: Renamed from source column method.
      - name: payment_status
        description: Renamed from source column status.

  - name: stg_order_status_history
    description: One row per order status transition (append-only).
    columns:
      - name: history_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: order_status
        description: Renamed from source column status.
