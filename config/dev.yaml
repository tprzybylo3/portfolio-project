# Settings that differ per environment; the DAG reads config/<PIPELINE_ENV>.yaml.
schedule: "0 0 * * *"   # 00:00 UTC
dbt:
  build_flags: ""       # dev runs unit tests too
# Step 6.5: retries with exponential backoff + per-stage timeouts.
retries:
  count: 2                  # dev: short, you are usually watching the run
  delay_seconds: 30         # 1st retry after 30-60 s, 2nd after 60-120 s (Airflow doubles + jitter)
  max_delay_seconds: 300    # cap for the doubling
execution_timeout_minutes:  # ~5-10x a normal run: a hung task fails instead of blocking later days
  extract: 10
  validate: 10
  spark_merge: 15
  dbt: 20
